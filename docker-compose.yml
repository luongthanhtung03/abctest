services:
  postgres:
    image: postgres:16-alpine
    container_name: abc-quote-db
    environment:
      POSTGRES_USER: abc
      POSTGRES_PASSWORD: abc
      POSTGRES_DB: abc_quote
    ports:
      # 5433 on the host to avoid clashing with a locally installed PostgreSQL
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
